<!doctype html>
<html lang="sv-SE">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400 900; src: url('../public/fonts/schibsted-grotesk-latin-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Schibsted Grotesk', sans-serif; background: #161C21; color: #F4F1EC; position: relative; }
  .byline { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 500; color: #B8C0C7; }

  .brand { position: absolute; left: 80px; top: 112px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { position: absolute; left: 80px; top: 214px; margin: 0; font-size: 84px; line-height: 1.0; letter-spacing: -0.03em; font-weight: 800; }
  h1 span { display: block; }
  .stair { position: absolute; right: 40px; bottom: 0; width: 400px; height: 280px; }
</style>
</head>

    <line x1="552.5" y1="50" x2="630" y2="50" stroke="#FF6A4B" stroke-width="5"/>
    <rect x="624" y="44" width="12" height="12" fill="none" stroke="#FF6A4B" stroke-width="2.5"/>
  </svg>
</body>
</html>
